<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar archivos</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:24px;background:#E9DECC;color:#172B55}h1{margin:0 0 4px}li{list-style:none;padding:3px 0}.ok{color:#0a7a3b}.no{color:#c4161c;font-weight:700}ul{padding:0}#res{font-weight:700;margin:12px 0}</style></head><body>
<h1>Verificar archivos del portafolio</h1><p>Abre esta página en tu sitio de GitHub: cada línea dice si el archivo cargó (✓) o si falta (✗).</p><div id="res">Comprobando…</div><ul id="l"></ul>
<script>
const files=["caso-04.html", "caso-jazz.html", "caso-palcafe.html", "caso-pandra.html", "contacto.html", "index.html", "proyectos.html", "sobre-mi.html", "styles.css", "main.js", "assets/carpeta-jazz.webp", "assets/carpeta-palcafe.webp", "assets/carpeta-pandra.webp", "assets/carpeta-yuki.webp", "assets/chocy.gif", "assets/chocy.webp", "assets/favicon.svg", "assets/flor-hero.webp", "assets/flor-proy-der.webp", "assets/flor-proy-izq.webp", "assets/foto-2.webp", "assets/foto-3.webp", "assets/jazz.webp", "assets/logo.png", "assets/mascota-telefono.webp", "assets/chocy-pintando.webp", "assets/onda-hero.webp", "assets/onda-sobre.webp", "assets/palcafe.webp", "assets/pandra.webp", "assets/paula-selfie.webp", "assets/yuki.webp", "assets/fonts/anton-latin-400-normal.woff2", "assets/fonts/ibm-plex-mono-latin-400-normal.woff2", "assets/fonts/ibm-plex-mono-latin-500-normal.woff2", "assets/fonts/inter-latin-400-normal.woff2", "assets/fonts/inter-latin-500-normal.woff2", "assets/fonts/inter-latin-600-normal.woff2", "assets/fonts/inter-latin-700-normal.woff2"];
const ul=document.getElementById('l');let bad=0,done=0;
files.forEach(f=>{const li=document.createElement('li');li.textContent='… '+f;ul.appendChild(li);
 fetch(f,{cache:'no-store'}).then(r=>{const ok=r.ok;li.className=ok?'ok':'no';li.textContent=(ok?'✓ ':'✗ FALTA ')+f;if(!ok)bad++;}).catch(()=>{li.className='no';li.textContent='✗ FALTA '+f;bad++;}).finally(()=>{done++;if(done===files.length)document.getElementById('res').textContent=bad?('Faltan '+bad+' archivo(s). Súbelos con el mismo nombre y en la misma carpeta.'):'Todo está en su lugar ✓';});});
</script></body></html>
